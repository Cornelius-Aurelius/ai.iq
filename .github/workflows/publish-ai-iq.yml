name: Publish AI.IQ site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-ai-iq
          fetch-depth: 0

      - name: Build production files
        run: |
          set -e
          cat payload/chunk_*.b64 | base64 -d > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C .
          mkdir -p assets
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          "$IM" -background none favicon.svg -resize 512x512 assets/icon-512.png
          "$IM" -background none favicon.svg -resize 192x192 assets/icon-192.png
          "$IM" -background none favicon.svg -resize 180x180 apple-touch-icon.png
          "$IM" -background none favicon.svg -resize 32x32 assets/favicon-32x32.png
          "$IM" -background none favicon.svg -define icon:auto-resize=256,128,64,48,32,16 favicon.ico
          "$IM" -background '#05070b' social-preview.svg -resize 1200x630 social-preview-1200x630.jpg

      - name: Publish to main
        run: |
          set -e
          git config user.name "AI.IQ Deploy"
          git config user.email "actions@github.com"
          git fetch origin main
          git merge origin/main --no-edit
          rm -f payload/chunk_*.b64
          rmdir payload
          rm -f .github/workflows/install-site.yml .github/workflows/publish-ai-iq.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Deploy AI.IQ production site"
          git push origin HEAD:main
