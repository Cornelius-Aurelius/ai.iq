name: Install AI.IQ production site

on:
  push:
    branches:
      - deploy-ai-iq
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: deploy-ai-iq
          fetch-depth: 0

      - name: Reconstruct production package
        shell: bash
        run: |
          set -euo pipefail
          cat payload/chunk_*.b64 | base64 -d > /tmp/aiiq-site.tar.gz
          tar -xzf /tmp/aiiq-site.tar.gz -C .

      - name: Generate favicon and social preview assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=convert
          fi
          "$IM" -background none favicon.svg -resize 512x512 assets/icon-512.png
          "$IM" -background none favicon.svg -resize 192x192 assets/icon-192.png
          "$IM" -background none favicon.svg -resize 180x180 apple-touch-icon.png
          "$IM" -background none favicon.svg -resize 32x32 assets/favicon-32x32.png
          "$IM" -background none favicon.svg -define icon:auto-resize=256,128,64,48,32,16 favicon.ico
          "$IM" -background '#05070b' social-preview.svg -resize 1200x630 social-preview-1200x630.jpg

      - name: Prepare clean production tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload
          rm -f .github/workflows/install-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Deploy production files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI.IQ Deploy"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy AI.IQ production site" || true
          git push origin HEAD:main --force-with-lease
